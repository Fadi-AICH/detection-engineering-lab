title: Suspicious PowerShell Encoded Command
id: 4a9f7d3e-7b1a-4c8d-9f0a-1b2c3d4e5f60
status: experimental
description: Detects PowerShell execution using encoded command-line content, a pattern often associated with obfuscation.
author: Fadi AICH
date: 2026-09-05
references:
  - https://attack.mitre.org/techniques/T1059/001/
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: '\\powershell.exe'
  selection_flag:
    CommandLine|contains:
      - ' -enc '
      - ' -encodedcommand '
      - ' -e '
  condition: selection_image and selection_flag
falsepositives:
  - Administrative scripts that intentionally use encoded PowerShell commands
level: medium
