title: Suspicious Scheduled Task Creation
id: 2fd9b6aa-935e-4b83-b220-b6b2d41b390f
status: experimental
description: Detects command-line creation of Windows scheduled tasks, useful for spotting persistence activity.
author: Fadi AICH
date: 2026-09-05
references:
  - https://attack.mitre.org/techniques/T1053/005/
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\\schtasks.exe'
    CommandLine|contains: '/create'
  condition: selection
falsepositives:
  - Software deployment systems
  - Legitimate administrator-created maintenance tasks
level: medium
